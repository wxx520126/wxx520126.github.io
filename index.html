<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的个人主页</title>
    <meta name="description" content="个人介绍、学习路径与学习笔记索引。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">WXX · 个人站</a>
      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="siteNav">菜单</button>
      <nav id="siteNav" class="site-nav" data-open="false">
        <a href="index.html" data-nav="home">首页</a>
        <a href="about.html" data-nav="about">自我介绍</a>
        <a href="notes.html" data-nav="notes">学习笔记</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="hero-tag">Welcome to my corner of the internet</p>
        <h1>你好，我是你的名字</h1>
        <p>
          这里将记录我的成长轨迹、学习笔记与思考沉淀。
          你可以先把核心介绍放在这里，再逐步补充项目、经历和文章。
        </p>
        <div class="hero-actions">
          <a class="button" href="about.html">查看自我介绍</a>
          <a class="button ghost" href="notes.html">浏览学习笔记</a>
        </div>
      </section>

      <section class="panel-grid">
        <article class="panel">
          <h2>个人定位</h2>
          <p>在这里放一句你想被记住的话，例如「专注于前端工程与效率工具」。</p>
        </article>
        <article class="panel">
          <h2>近期目标</h2>
          <p>列出 1-3 个短期目标：比如完成某门课程、发布 10 篇笔记、做一个完整项目。</p>
        </article>
        <article class="panel">
          <h2>更新动态</h2>
          <p>预留为「最近更新」区域，后续可改为自动读取你最新的笔记链接。</p>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> 你的名字 · 构建于 GitHub Pages</p>
    </footer>
  </body>
</html>
