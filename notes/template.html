    <header class="site-header">

      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="siteNav">菜单</button>
      <nav id="siteNav" class="site-nav" data-open="false">

    <main class="page-main">
      <article class="note-article panel">
        <p class="note-label">专题标签</p>
        <h1>在这里填写你的笔记标题</h1>
        <p>发布时间：YYYY-MM-DD | 作者：你的名字</p>

        <h2>1. 问题背景</h2>
        <p>描述你为什么学习这个主题，以及你想解决的问题。</p>

        <h2>2. 核心知识点</h2>
        <p>按点整理，不必一次写完，先把骨架列出来再补细节。</p>

        <h2>3. 示例</h2>
        <pre><code>// 在这里放代码或命令示例
// 例如：git clone your-repo
</code></pre>

        <h2>4. 总结</h2>
        <p>写下你的收获、仍然不懂的点、后续行动计划。</p>
      </article>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> 你的名字 · 构建于 GitHub Pages</p>
    </footer>
